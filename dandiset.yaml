description: "This dataset accompanies Shi, Bi, Hesse, Lanfranchi, Chen & Tsao, \"\
  Rapid concerted switching of the neural code in the inferotemporal cortex\", Nature
  653, 146–155 (2026), doi:10.1038/s41586-026-10267-3.\nThree male rhesus macaques
  (Macaca mulatta) passively fixated while greyscale images of human faces and non-face
  objects (3.9°, 150 ms on / 150 ms off) were presented. Neurons in the fMRI-identified
  face patches ML and AM were recorded with Neuropixels 1.0 NHP probes and spike-sorted
  with Kilosort.\nFor each session, the NWB file contains trial-averaged firing rates
  (1 ms bins) of the face-selective units analysed in the paper, unit metadata, the
  stimulus images, and AlexNet fc6 features of every image projected into the paper's
  general-object space and face space. Code to reproduce the main figures from these
  files is available."
